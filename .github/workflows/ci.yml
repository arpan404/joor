name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - staging

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

      - name: Lint and typecheck
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build package
        run: npm run build
